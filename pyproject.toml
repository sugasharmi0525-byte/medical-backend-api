# Runtime dependencies for Vercel (which installs from this file). Local development still
# uses requirements.txt; PyMySQL replaces mysqlclient here because it needs no C libraries.
[project]
name = "medicine-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "PyMySQL>=1.1,<1.2",
    "django-environ>=0.11,<0.12",
    "django-filter>=24.2,<25",
    "django-cors-headers>=4.4,<5",
    "drf-spectacular>=0.27,<0.28",
    "celery>=5.4,<5.5",
    "whitenoise>=6.7,<7",
    "Pillow>=10.4,<12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff.lint.per-file-ignores]
# Message wording reads better unwrapped.
"apps/notifications/defaults.py" = ["E501"]
